name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - name: Unit + integration tests
        run: python -m pytest -q tests
      - name: Smoke test the full pipeline (scrape -> train)
        run: |
          python scraper.py --pages 15 --seed 1
          python model.py --min-rows 50

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t job-intel .
